Edition: 3.0.0
Type: Project
Name: fc-gpt-sovits-v2
Version: 0.0.4
Provider:
  - 阿里云 
Description: FC版GPT-SoVITS项目部署模版的V2版更新，推理更快，效果更好。可实现高质量TTS（Text to Speech）文字到语音生成和快速语音克隆。
HomePage: https://www.serverless-devs.com
Tags: 
  - AI
  - 人工智能
Category: 人工智能 
Service:
  函数计算:
    Runtime: custom
    Authorities:
      - 创建函数
Organization: 阿里云函数计算（FC） 
Effective: Public 
Parameters:
  type: object
  additionalProperties: false 
  required: 
    - region
    - functionName
  properties:
    region:
      title: 地域
      type: string
      default: cn-hangzhou
      description: 创建应用所在的地区
      enum:
        - cn-hangzhou
    functionName:
      title: 函数名称
      type: string
      default: gpt-sovits-v2-${default-suffix}
      description: 应用函数名称
    inferBucketName:
      title: 推理API OSS存储桶名
      type: string
      default: ""
      description: OSS存储桶名(注意和函数同地域)
      x-bucket:
        dependency:
          - region
    trainBucketName:
      title: 训练API OSS存储桶名
      type: string
      default: ""
      description: OSS存储桶名(注意和函数同地域)
      x-bucket:
        dependency:
          - region
